- tag: "Performance Architecture"
  title: "Thread Utilisation & Server Sizing"
  desc: "A process with modest workload gets a single-core server. A service handling many latency-sensitive requests gets more processing capacity and a server sized to match. The software and hardware were designed together, not separately."
